name: Build & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x86_64
          - runner: ubuntu-24.04-arm
            name: linux-aarch64
          - runner: macos-latest
            name: macos-arm64

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the CLI
        run: make

      # The suite runs on synthetic GGUF fixtures it generates itself, so CI
      # never downloads a model. `make test` also drives the CLI end to end:
      # profile -> plan -> apply -> validate, plus a byte-for-byte check that
      # `poe forge` produces the same file as the staged pipeline.
      - name: Run the test suite
        run: make test

      - name: Fixture generator builds
        run: make tools

      # The profiler links against llama.cpp and is the one target CI cannot
      # build; it is exercised on hardware instead. Keeping it out of the
      # matrix is deliberate, not an oversight.
      - name: The CLI answers
        run: |
          ./poe --version
          ./poe --help > /dev/null
